<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PantryPal</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7f6;
        color: #222;
    }

    header {
        background: linear-gradient(135deg, #0f766e, #2563eb);
        color: white;
        padding: 30px 20px;
        text-align: center;
    }

    header h1 {
        margin: 0;
        font-size: 36px;
    }

    header p {
        margin-top: 8px;
        font-size: 16px;
    }

    .container {
        max-width: 700px;
        margin: 25px auto;
        padding: 0 15px;
    }

    .card {
        background: white;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
        margin-top: 0;
        color: #0f766e;
    }

    label {
        display: block;
        font-weight: bold;
        margin-top: 15px;
        margin-bottom: 6px;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 12px 18px;
        font-size: 15px;
        cursor: pointer;
        font-weight: bold;
    }

    .main-button {
        width: 100%;
        margin-top: 20px;
        background: #0f766e;
        color: white;
    }

    .main-button:hover {
        background: #0b5f59;
    }

    .filter-button {
        width: 100%;
        margin-top: 15px;
        background: #e5e7eb;
        color: #222;
    }

    .filters {
        display: none;
        margin-top: 15px;
        padding-top: 10px;
        border-top: 1px solid #ddd;
    }

    .checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
    }

    .checkbox-group label {
        font-weight: normal;
        margin: 0;
        background: #f1f5f9;
        padding: 8px 10px;
        border-radius: 7px;
    }

    .checkbox-group input {
        width: auto;
    }

    .recipe {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 16px;
        margin-top: 15px;
    }

    .recipe h3 {
        margin-top: 0;
        color: #2563eb;
    }

    .recipe-info {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0;
    }

    .tag {
        background: #e0f2fe;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 13px;
    }

    .match {
        font-weight: bold;
        color: #0f766e;
    }

    .hidden {
        display: none;
    }

    .empty {
        text-align: center;
        padding: 20px;
        color: #666;
    }

    .plan-day {
        background: #f8fafc;
        border-radius: 10px;
        padding: 12px;
        margin-top: 10px;
    }

    footer {
        text-align: center;
        padding: 25px;
        color: #777;
        font-size: 13px;
    }
</style>
</head>

<body>

<header>
    <h1>🍽️ PantryPal</h1>
    <p>You have the ingredients. We find the possibilities.</p>
</header>

<div class="container">

    <!-- SEARCH -->
    <div class="card">

        <h2>Find a Dish</h2>

        <label for="people">How many people?</label>

        <select id="people">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="4" selected>3–4</option>
            <option value="6">5–6</option>
            <option value="8">7+</option>
        </select>


        <label for="cuisine">Cuisine / Country</label>

        <select id="cuisine">
            <option value="Any">Any</option>
            <option value="Indian">Indian</option>
            <option value="Italian">Italian</option>
            <option value="Chinese">Chinese</option>
            <option value="Japanese">Japanese</option>
            <option value="Mexican">Mexican</option>
            <option value="Thai">Thai</option>
            <option value="Korean">Korean</option>
            <option value="Greek">Greek</option>
        </select>


        <label for="meal">Meal</label>

        <select id="meal">
            <option value="Any">Any</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
            <option value="Snack">Snack</option>
            <option value="Dessert">Dessert</option>
        </select>


        <label for="ingredients">Ingredients you have</label>

        <input
            id="ingredients"
            type="text"
            placeholder="Example: rice, onion, tomato"
        >


        <button class="filter-button" onclick="toggleFilters()">
            ⚙️ More Filters
        </button>


        <!-- MORE FILTERS -->

        <div class="filters" id="filters">

            <label for="budget">Maximum budget (₹)</label>

            <input
                id="budget"
                type="number"
                placeholder="Example: 300"
            >


            <label for="budgetStrict">Budget strictness</label>

            <select id="budgetStrict">
                <option value="flexible">Flexible</option>
                <option value="strict">Strict</option>
            </select>


            <label for="time">Maximum cooking time</label>

            <select id="time">
                <option value="999">Any</option>
                <option value="15">15 minutes</option>
                <option value="30">30 minutes</option>
                <option value="45">45 minutes</option>
                <option value="60">60 minutes</option>
            </select>


            <label for="difficulty">Difficulty</label>

            <select id="difficulty">
                <option value="Any">Any</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>


            <label>Equipment available</label>

            <div class="checkbox-group">

                <label>
                    <input type="checkbox" class="equipment" value="Stovetop">
                    Stovetop
                </label>

                <label>
                    <input type="checkbox" class="equipment" value="Oven">
                    Oven
                </label>

                <label>
                    <input type="checkbox" class="equipment" value="Microwave">
                    Microwave
                </label>

                <label>
                    <input type="checkbox" class="equipment" value="Air fryer">
                    Air fryer
                </label>

                <label>
                    <input type="checkbox" class="equipment" value="Pressure cooker">
                    Pressure cooker
                </label>

            </div>


            <label for="flexibility">Ingredient flexibility</label>

            <select id="flexibility">

                <option value="all">
                    I need all my ingredients to match
                </option>

                <option value="two">
                    Most ingredients should match
                </option>

                <option value="none">
                    Ingredients don't matter much
                </option>

            </select>


            <label for="avoid">Ingredients to avoid</label>

            <input
                id="avoid"
                type="text"
                placeholder="Example: peanuts, mushrooms"
            >


            <label>Dietary preferences</label>

            <div class="checkbox-group">

                <label>
                    <input type="checkbox" class="diet" value="Vegetarian">
                    Vegetarian
                </label>

                <label>
                    <input type="checkbox" class="diet" value="Vegan">
                    Vegan
                </label>

                <label>
                    <input type="checkbox" class="diet" value="Egg-free">
                    Egg-free
                </label>

                <label>
                    <input type="checkbox" class="diet" value="Dairy-free">
                    Dairy-free
                </label>

            </div>


            <label>Food characteristics</label>

            <div class="checkbox-group">

                <label>
                    <input type="checkbox" class="characteristic" value="Spicy">
                    🌶️ Spicy
                </label>

                <label>
                    <input type="checkbox" class="characteristic" value="Mild">
                    Mild
                </label>

                <label>
                    <input type="checkbox" class="characteristic" value="Sweet">
                    Sweet
                </label>

                <label>
                    <input type="checkbox" class="characteristic" value="Savoury">
                    Savoury
                </label>

            </div>


            <label for="effort">Effort</label>

            <select id="effort">

                <option value="Any">Any</option>
                <option value="Minimal">Minimal</option>
                <option value="Normal">Normal</option>
                <option value="Project">Project</option>

            </select>

        </div>


        <button class="main-button" onclick="findRecipes()">
            🔎 Find Dishes
        </button>

    </div>


    <!-- RESULTS -->

    <div class="card">

        <h2>Results</h2>

        <div id="results">

            <div class="empty">
                Choose your preferences and click
                <b>Find Dishes</b>.
            </div>

        </div>

    </div>


    <!-- MEAL PLANNER -->

    <div class="card">

        <h2>📅 Meal Planner</h2>

        <label for="days">Plan length</label>

        <select id="days">
            <option value="3">3 days</option>
            <option value="5">5 days</option>
            <option value="7">7 days</option>
        </select>


        <label for="planMeal">Meals</label>

        <select id="planMeal">
            <option value="Dinner">Dinner</option>
            <option value="Lunch">Lunch</option>
            <option value="Both">Lunch + Dinner</option>
        </select>


        <button class="main-button" onclick="createMealPlan()">
            📅 Create Meal Plan
        </button>

        <div id="mealPlan"></div>

    </div>

</div>


<footer>
    PantryPal • Recipe matching without AI
</footer>


<script>

const recipes = [

    {

        ],

        ],

            "Vegetarian",

        ],

    },

    {
        name: "Chicken Tacos",
        country: "Mexico",
        cuisine: "Mexican",
        meal: "Dinner",
        servings: 4,
        cost: 480,
        time: 40,
        difficulty: "Intermediate",
        equipment: ["Stovetop"],
        ingredients: [
            "chicken",

            "onion",

        ],

        ],

    },

    {

    {

        ],

    {

        time: 15,
        difficulty: "Beginner",
        equipment: [],

            "tomato",

            "onion",

        ],

            "Savoury"
        ],
        diet: ["Vegetarian"],
        effort: "Minimal"
    }

];


function toggleFilters() {

    const filters = document.getElementById("filters");

    if (filters.style.display === "block") {

        filters.style.display = "none";

    } else {

        filters.style.display = "block";

    }

}


function getChecked(className) {

    return Array.from(
        document.querySelectorAll("." + className + ":checked")
    ).map(item => item.value);

}


function findRecipes() {

    const people =
        Number(document.getElementById("people").value);

    const cuisine =
        document.getElementById("cuisine").value;

    const meal =
        document.getElementById("meal").value;

    const ingredientText =
        document.getElementById("ingredients").value
        .toLowerCase();

    const wantedIngredients =
        ingredientText
        .split(",")
        .map(x => x.trim())
        .filter(x => x !== "");

    const budget =
        Number(document.getElementById("budget").value);

    const budgetStrict =
        document.getElementById("budgetStrict").value;

    const maxTime =
        Number(document.getElementById("time").value);

    const difficulty =
        document.getElementById("difficulty").value;

    const equipment =
        getChecked("equipment");

    const flexibility =
        document.getElementById("flexibility").value;

    const avoidText =
        document.getElementById("avoid").value
        .toLowerCase();

    const avoidIngredients =
        avoidText
        .split(",")
        .map(x => x.trim())
        .filter(x => x !== "");

    const diets =
        getChecked("diet");

    const characteristics =
        getChecked("characteristic");

    const effort =
        document.getElementById("effort").value;


    let results = [];


    recipes.forEach(recipe => {

        let score = 0;

        /*
            CUISINE
        */

        if (cuisine === "Any") {

            score += 15;

        } else if (recipe.cuisine === cuisine) {

            score += 25;

        } else {

            return;

        }


        /*
            MEAL
        */

        if (meal === "Any") {

            score += 8;

        } else if (recipe.meal === meal) {

            score += 15;

        } else {

            return;

        }


        /*
            INGREDIENTS
        */

        let matchedIngredients = 0;

        wantedIngredients.forEach(ingredient => {

            if (
                recipe.ingredients.some(
                    item => item.includes(ingredient)
                )
            ) {

                matchedIngredients++;

            }

        });


        let ingredientScore = 0;

        if (wantedIngredients.length > 0) {

            ingredientScore =
                (matchedIngredients /
                wantedIngredients.length) * 30;

        } else {

            ingredientScore = 15;

        }

        score += ingredientScore;


        /*
            INGREDIENT FLEXIBILITY
        */

        if (wantedIngredients.length > 0) {

            if (
                flexibility === "all" &&
                matchedIngredients < wantedIngredients.length
            ) {

                return;

            }

            if (
                flexibility === "two" &&
                matchedIngredients < Math.min(2, wantedIngredients.length)
            ) {

                return;

            }

        }


        /*
            BUDGET
        */

        if (budget > 0) {

            if (
                budgetStrict === "strict" &&
                recipe.cost > budget
            ) {

                return;

            }

            if (recipe.cost <= budget) {

                score += 15;

            } else {

                score -= 5;

            }

        }


        /*
            TIME
        */

        if (recipe.time <= maxTime) {

            score += 8;

        } else {

            score -= 5;

        }


        /*
            DIFFICULTY
        */

        if (
            difficulty === "Any" ||
            recipe.difficulty === difficulty
        ) {

            score += 5;

        } else {

            score -= 2;

        }


        /*
            EQUIPMENT
        */

        if (equipment.length > 0) {

            const hasEquipment =
                equipment.some(
                    item => recipe.equipment.includes(item)
                );

            if (hasEquipment) {

                score += 5;

            } else {

                return;

            }

        }


        /*
            AVOID INGREDIENTS
        */

        const containsAvoid =
            avoidIngredients.some(avoid =>
                recipe.ingredients.some(
                    ingredient =>
                        ingredient.includes(avoid)
                )
            );

        if (containsAvoid) {

            return;

        }


        /*
            DIET
        */

        for (const diet of diets) {

            if (!recipe.diet.includes(diet)) {

                return;

            }

        }


        /*
            CHARACTERISTICS
        */

        characteristics.forEach(characteristic => {

            if (
                recipe.characteristics.includes(characteristic)
            ) {

                score += 3;

            }

        });


        /*
            EFFORT
        */

        if (
            effort === "Any" ||
            recipe.effort === effort
        ) {

            score += 3;

        }


        /*
            SERVINGS
        */

        if (people <= recipe.servings) {

            score += 3;

        }


        results.push({

            recipe: recipe,
            score: Math.round(score),
            matched: matchedIngredients

        });

    });


    results.sort((a, b) => b.score - a.score);


    displayResults(results);

}


function displayResults(results) {

    const container =
        document.getElementById("results");


    if (results.length === 0) {

        container.innerHTML = `
            <div class="empty">
                😕 No dishes matched your filters.
                <br><br>
                Try changing some of your filters.
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    results.forEach(item => {

        const recipe = item.recipe;


        const card =
            document.createElement("div");

        card.className = "recipe";


        card.innerHTML = `

            <h3>${recipe.name}</h3>

            <div class="recipe-info">

                <span class="tag">
                    🌍 ${recipe.country}
                </span>

                <span class="tag">
                    🍽️ ${recipe.meal}
                </span>

                <span class="tag">
                    ⏱️ ${recipe.time} min
                </span>

                <span class="tag">
                    💰 ₹${recipe.cost}
                </span>

                <span class="tag">
                    👨‍👩‍👧‍👦 ${recipe.servings} servings
                </span>

                <span class="tag">
                    ⭐ ${recipe.difficulty}
                </span>

            </div>


            <p class="match">
                Match: ${item.score}%
            </p>


            <p>
                <b>Ingredients:</b>
                ${recipe.ingredients.join(", ")}
            </p>


            <p>
                <b>Equipment:</b>
                ${
                    recipe.equipment.length
                    ? recipe.equipment.join(", ")
                    : "None"
                }
            </p>

        `;


        container.appendChild(card);

    });

}


function createMealPlan() {

    const days =
        Number(document.getElementById("days").value);

    const planMeal =
        document.getElementById("planMeal").value;

    const container =
        document.getElementById("mealPlan");


    let availableRecipes =
        recipes.filter(recipe => {

            if (planMeal === "Both") {

                return (
                    recipe.meal === "Lunch" ||
                    recipe.meal === "Dinner"
                );

            }

            return recipe.meal === planMeal;

        });


    if (availableRecipes.length === 0) {

        container.innerHTML =
            "<p>No recipes available for this plan.</p>";

        return;

    }


    let html = "";

    let totalCost = 0;


    for (let i = 0; i < days; i++) {

        const recipe =
            availableRecipes[
                i % availableRecipes.length
            ];


        totalCost += recipe.cost;


        html += `

            <div class="plan-day">

                <b>Day ${i + 1}</b>

                <br>

                ${recipe.name}

                <br>

                <small>
                    ₹${recipe.cost} •
                    ${recipe.time} minutes
                </small>

            </div>

        `;

    }


    html += `

        <p>
            <b>Estimated total:</b>
            ₹${totalCost}
        </p>

    `;


    container.innerHTML = html;

}

</script>

</body>
</html>
